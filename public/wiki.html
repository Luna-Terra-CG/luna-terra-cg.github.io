<style>

:root {
  --accent: var(--mauve) !important;
  --accent-alt: color-mix(in oklab, var(--accent) 80%, var(--overlay2)) !important;
}
/* basics */
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0px;
}
p, h4, h3 {
  margin: 0px;
}
a:link {
  color: var(--mauve);
}
a:visited {
  color: var(--pink);
}
a:hover {
  color: var(--pink);
}
a:active {
  color: var(--sky);
}
::-moz-selection {
  color: var(--base);
  background: var(--accent-alt);
  text-shadow: none !important;
}
::selection {
  color: var(--base);
  background: var(--accent-alt);
  background-color: var(--accent-alt) !important;
  text-shadow: none !important;
}

/* background */
.background {
  background: linear-gradient(165deg in oklab, color-mix(var(--base) 69%, var(--mantle) ), color-mix(var(--accent) 30%, var(--surface2)));
  position: fixed;
  top: 0px;
  bottom: 0px;
  right: 0px;
  left: 0px;
}
.background_stars {
  background-image: url("assets_hwbm/background.png");
  background-repeat: repeat;
  position: fixed;
  top: 0px;
  bottom: 0px;
  right: 0px;
  left: 0px;
}
.background_scanLines {
  background-image: url("assets/scanlines.png");
  background-repeat: repeat;
  opacity: 0.135;
  position: fixed;
  top: 0px;
  bottom: 0px;
  right: 0px;
  left: 0px;
}
#help {
  display: flex;
  width: 100%;
  height: 100%;
  position: fixed;
}
/* abuse the sidebar css into working correctly >w< */
.sidebar {
  margin-top: auto;
  width: fit-content;
  position: relative;
  top: 85%;
  transform: translateY(-100%);
}
/* change active tab color */
.sidebar_wiki {
  background: var(--accent-alt);
  color: var(--base);
  outline: 2px solid var(--accent-alt);
}
.sidebar_wiki:hover {
  outline: 2px solid var(--accent-alt) !important;
}

/* the actual site */
.jank {
  display: flex;
  flex-direction: row;
  height: 100%;
  width: 100%;
  z-index: 100;
}
.sidebar_flexbox {
  height: 100%;
  width: 100%;
  padding-right: 115px;
  width: fit-content;
}
.wiki_container {
  flex-grow: 3;
  height: auto;
  width: 100%;
  display: flex;
  flex-direction: row;
}
.wiki_contents {
  flex-grow: 3;
  background: radial-gradient(circle at bottom right, rgba(var(--surface1-rgb), 0.8), rgba(var(--surface0-rgb), 0.6), color-mix(in oklab, color-mix(in oklab, var(--base) 96%, var(--accent)) 70%, transparent) );
  backdrop-filter: blur(4px);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}
#cool_buttons {
  margin: 12px;
  margin-top: 30px;
}
#cool_buttons > a:last-child > .big_button {
  margin-bottom: 0px;
}
.big_button {
  line-height: 22px;
  font-family: "IBM Plex Sans", sans-serif;
  font-weight: 400;
  color: var(--text);
  background: rgba(var(--surface0-rgb), 0.8);
  padding: 8px;
  transition: all 0.3s;
  margin-bottom: 12px;
}
.big_button:hover {
  font-weight: 700;
  outline: 2px solid var(--accent);
  background: rgba(var(--surface1-rgb), 0.6);
}
.button_arrow {
  height: 22px;
  display: flex;
  float: right;
  margin-right: 5px;
  transform: translate(0px, -22px);
}

/* borderyy crap */
#header {
  background: color-mix(in oklab, var(--mantle) 20%, transparent);
  width: 100%;
  height: 28px;
}
#header_text {
  display: inline;
  font-family: oxygen;
  font-weight: 300;
  line-height: 20px;
  vertical-align: middle;
  color: var(--overlay1);
  text-align: left;
  margin-left: 5px;
}
footer {
  color: var(--text);
  width: 100%;
  text-align: center;
  background: color-mix(in oklab, var(--mantle) 30%, transparent);
  margin-top: auto;
  font-size: 15px;
  padding-top: 2px;
  padding-bottom: 2px;
  font-family: "Oxygen", sans-serif;
  align-self: bottom;
}

</style>
</head>
